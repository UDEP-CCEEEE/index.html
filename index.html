<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis UDEP</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #F5F7FA;
  }

  #app {
    max-width: 420px;
    height: 100vh;
    margin: auto;
    display: flex;
    flex-direction: column;
    background: white;
  }

  #header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid #ddd;
  }

  .logo-left {
    width: 100px;
  }

  .header-text {
    color: #003A8F;
    font-weight: 500;
  }

  #chat {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
  }

  .msg {
    max-width: 75%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 12px;
  }

  .bot {
    background: #eee;
  }

  .user {
    background: #003A8F;
    color: white;
    margin-left: auto;
  }

  .time {
    font-size: 10px;
    opacity: 0.6;
    text-align: right;
  }

  .btn {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    margin: 6px 0;
    border-radius: 12px;
    background: #003A8F;
    color: white;
    border: none;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .num {
    width: 28px;
    height: 28px;
    background: white;
    color: #003A8F;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }

  .txt { flex: 1; text-align: left; }

  .icon { font-size: 16px; }

  /* Estilos para los botones contextuales fluidos */
  .ctx-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 4px 0 10px 0;
    animation: aparecer 0.3s ease;
  }

  .ctx-btn {
    background: #F0F4FA;
    color: #003A8F;
    border: 1px solid #003A8F;
    padding: 10px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    font-weight: 500;
  }

  .ctx-btn:hover {
    background: #003A8F;
    color: white;
  }

  #inputArea {
    display: flex;
    padding: 10px;
    background: #eee;
  }

  #input {
    flex: 1;
    padding: 14px;
    font-size: 15px;
    border-radius: 10px;
    border: none;
  }

  button.send-btn {
    margin-left: 5px;
    padding: 14px;
    font-size: 16px;
    border-radius: 10px;
    background: #003A8F;
    color: white;
    border: none;
    cursor: pointer;
  }

  .despedida {
    text-align: center;
    animation: aparecer 0.5s ease;
  }

  .despedida img {
    width: 100px;
    border-radius: 12px;
    animation: bounce 1s ease;
  }

  .footer-creditos {
    text-align: center;
    font-size: 11px;
    color: #888;
    padding: 8px 0;
    background: #eee;
    border-top: 1px solid #ddd;
  }

  @keyframes aparecer {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes bounce {
    0% { transform: translateY(0); }
    30% { transform: translateY(-10px); }
    60% { transform: translateY(5px); }
    100% { transform: translateY(0); }
  }
</style>
</head>

<body>

<div id="app">
  <div id="header">
    <img class="logo-left" src="https://www.udep.edu.pe/direccion-comunicacion/wp-content/uploads/sites/20/2020/11/LogoUDEPazul.png">
    <div class="header-text">CC.EE.EE</div>
  </div>

  <div id="chat"></div>

  <div id="inputArea">
    <input id="input" placeholder="Escribe &quot;Hola&quot; para empezar">
    <button class="send-btn" onclick="enviar()">➤</button>
  </div>

  <div class="footer-creditos">
    Una creación de: Lázaro Purizaca
  </div>
</div>

<script>
const chat = document.getElementById("chat");

// Variable global para almacenar el hilo de la conversación (Memoria contextual)
let contextoGlobal = ""; 

function hora(){
  const d=new Date();
  return d.getHours()+":"+d.getMinutes().toString().padStart(2,'0');
}

function bot(msg){
  const div=document.createElement("div");
  div.className="msg bot";
  div.innerHTML=msg + `<div class="time">${hora()}</div>`;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function user(msg){
  const div=document.createElement("div");
  div.className="msg user";
  div.innerHTML=msg + `<div class="time">${hora()}</div>`;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

// Generador de respuestas contextuales rápidas basadas en clicks fluidos
function botonesContextuales(lista) {
  limpiarContextuales();
  const contenedor = document.createElement("div");
  contenedor.className = "ctx-container";
  lista.forEach(item => {
    const b = document.createElement("button");
    b.className = "ctx-btn";
    b.innerHTML = item.texto;
    b.onclick = () => {
      document.getElementById("input").value = item.valor;
      enviar();
    };
    contenedor.appendChild(b);
  });
  chat.appendChild(contenedor);
  chat.scrollTop = chat.scrollHeight;
}

function limpiarContextuales() {
  document.querySelectorAll(".ctx-container").forEach(c => c.remove());
}

function bienvenida(){
  const div=document.createElement("div");
  div.className="msg bot";
  div.innerHTML = `
    <div style="text-align:center">
      <img src="mascota.png.jfif" style="width:120px; border-radius:12px; margin-bottom:10px;">
      <br>
      <b>Hola, soy Jarvis 👋</b><br>
      ¿En qué puedo ayudarte?
    </div>
  `;
  chat.appendChild(div);
  menu();
}

function btn(text,val){
  const b=document.createElement("button");
  b.className="btn";
  const partes = text.split(" ");
  const numero = partes[0];
  const texto = partes.slice(1).join(" ");

  let icono="📌";
  if(val==="1") icono="🕒";
  if(val==="2") icono="🏢";
  if(val==="3") icono="📚";
  if(val==="4") icono="📅";
  if(val==="tramites") icono="🧭";
  if(val==="guias") icono="📂";

  b.innerHTML = `
    <span class="num">${numero}</span>
    <span class="txt">${texto}</span>
    <span class="icon">${icono}</span>
  `;
  b.onclick=()=>responder(val);
  chat.appendChild(b);
}

function limpiar(){
  document.querySelectorAll(".btn").forEach(b=>b.remove());
  limpiarContextuales();
}

function menu(){
  limpiar();
  contextoGlobal = ""; // Resetea la memoria al volver al menú principal
  bot("Selecciona una opción:");
  btn("1 Horario de atención en ventanilla","1");
  btn("2 Horario de atención en secretaría","2");
  btn("3 Cómo reservar sala de estudio","3");
  btn("4 Publicación de exámenes / Calendario","4");
  btn("5 Información sobre trámites","tramites");
  btn("6 Guías y Documentos PDF","guias");
}

function menuTramites(){
  limpiar();
  bot("¿Sobre qué necesitas ayuda?");
  btn("1 Bachiller / Egresado","egresado");
  btn("2 Certificados / Documentos","docs");
  btn("3 Idiomas","idiomas");
  btn("4 Mesa de ayuda","mesa");
  btn("5 Volver al inicio","si");
}

function menuGuias(){
  limpiar();
  bot("📂 <b>Documentos y Guías PDF:</b><br>Selecciona para abrir el archivo.");
  btn("1 Prácticas Pre Profesionales", "pdf_practicas");
  btn("2 Presentación de CLC", "pdf_clc");
  btn("3 Justificación de Inasistencias", "pdf_inasistencias");
  btn("4 Reprogramación de Exámenes", "pdf_repro");
  btn("5 Hoja de Reclamos", "pdf_reclamos");
  btn("6 Volver al inicio", "si");
}

function opciones(){
  bot("¿Necesitas otra opción?");
  btn("1 Sí","si");
  btn("2 No","no");
}

function enviar(){
  const input=document.getElementById("input");
  const texto=input.value.trim().toLowerCase();
  if(texto==="") return;
  input.value="";
  user(texto);
  limpiarContextuales();

  // --- MOTOR COGNITIVO DE CONVERSACIÓN CON MEMORIA DE CONTEXTO ---
  const verificar = (lista) => lista.some(palabra => texto.includes(palabra));

  // 1. EVALUACIÓN DE CONTEXTOS ACTIVOS (MEMORIA REORGANIZADA DE RECLAMOS)
  if (contextoGlobal === "preguntando_reclamos") {
    if (verificar(["primer", "1er"]) && verificar(["no pasa", "rechaza", "denega", "rebot", "no proced"])) {
      bot("Existen varios motivos, pero el común es que no fundamentaste bien, lamentablemente no podrás presentar otro reclamo o un segundo reclamo ya que el primero no pasa.");
      botonesContextuales([
        { texto: "📝 ¿Cómo hacer un segundo reclamo?", valor: "como hacer un segundo reclamo" },
        { texto: "📂 Ir al menú de Reclamos", valor: "reclamos" }
      ]);
      return;
    }
    if (verificar(["segundo", "2do"]) && verificar(["rechaza", "no pasa", "denega", "rebot", "no proced"])) {
      bot("Debes fundamentarlo mejor ya que un segundo reclamo es más específico");
      setTimeout(() => opciones(), 600);
      return;
    }
    if (verificar(["segundo", "2do"]) && verificar(["donde", "como", "cómo", "ver", "revisar", "solicitar", "visuali"])) {
      bot("Únicamente lo puedes solicitar de manera presencial en la secretaría académica, algo importante es que no te lo puedes llevar ni tomar foto, solo mirarlo y revisarlo");
      setTimeout(() => opciones(), 600);
      return;
    }
    if (verificar(["fuera de la hora", "fuera de hora", "tarde", "plazo vencido", "vencio el plazo", "paso la hora", "fuera de plazo", "tiempo vencido"])) {
      bot("No procederá ya que son plazos establecidos.");
      setTimeout(() => opciones(), 600);
      return;
    }
    if (verificar(["segundo", "segundo reclamo", "2do", "apelacion", "apelar", "gestion", "gestión", "procedimiento"])) {
      bot("En ventanilla de secretaría académica hay una guía para hacer el segundo reclamo, pero te adelanto algo importante, los segundos reclamos se presentan únicamente en ventanilla, no en el buzón.");
      botonesContextuales([
        { texto: "👁️ ¿Cómo ver mi 2do Reclamo?", valor: "como puedo ver mi segundo reclamo" },
        { texto: "❓ ¿Qué pasa si lo rechazan?", valor: "que pasa si me rechazan mi segundo reclamo" }
      ]);
      return;
    }
  }

  // Si venían hablando de Horarios
  if (contextoGlobal === "preguntando_horario") {
    if (verificar(["secretaria", "secretaría", "secre"])) {
      bot("🕒 Horario de atención en secretaría: 10:00 am - 12:30 pm y 4:10 pm - 5:30 pm<br>📞 Anexo: 3113");
      contextoGlobal = "secretaria";
      botonesContextuales([
        { texto: "📧 Correo de Secretaría", valor: "correo de secretaria académica" },
        { texto: "🕒 Ver Horario de Ventanilla", valor: "horario ventanilla" }
      ]);
      return;
    } else if (verificar(["ventanilla", "ventanillas", "vntanilla"])) {
      bot("🕒 Horario de atención en ventanilla: 9:00 am - 12:30 pm y 4:00 pm - 6:00 pm");
      contextoGlobal = "ventanilla";
      setTimeout(() => opciones(), 600);
      return;
    }
  }

  // Seguimiento conversacional: Si ya están en el flujo de Secretaría y piden anexos o correos
  if (contextoGlobal === "secretaria") {
    if (verificar(["anexo", "numero", "número", "telefono", "teléfono", "llamar"])) {
      bot("El anexo directo de Secretaría Académica es <b>3113</b>.");
      setTimeout(() => opciones(), 600);
      return;
    }
    if (verificar(["correo", "mail", "email", "escribir"])) {
      bot("Puedes escribirles a su correo institucional:<br>📧 <b style='color:#003A8F;'>secretaria.academica.cceeee@udep.edu.pe</b>");
      setTimeout(() => opciones(), 600);
      return;
    }
  }

  // Si venían hablando de Exámenes de forma general
  if (contextoGlobal === "preguntando_examen") {
    if (verificar(["recoger", "recojer", "que necesito", "llevar", "requisito"])) {
      bot("Necesitas tu identificación en físico o puedes enseñar tu siga");
      contextoGlobal = "examen_recojo";
      setTimeout(() => opciones(), 600);
      return;
    }
    if (verificar(["tolerancia", "tiempo", "minutos", "tarde", "limite", "límite"])) {
      bot("Según el RFAG, solo existen 15 minutos de tolerancia después de iniciar el examen, o sea que si empieza a las 2:00 p.m, entonces hay tolerancia de 2:15 p.m. (lo encuentras en el artículo 37 inciso 37.2)");
      contextoGlobal = "examen_tolerancia";
      setTimeout(() => opciones(), 600);
      return;
    }
    if (verificar(["rol", "fechas", "cronograma", "donde ver", "publicados", "lista"])) {
      bot("Por supuesto. Aquí tienes el acceso directo al rol oficial para ver los exámenes que ya están publicados y listos para recoger en la facultad:");
      setTimeout(() => responder("4"), 600);
      return;
    }
  }

  // SOLUCIÓN AL BUCLE DE IDIOMAS: Si venían hablando de Idiomas y responden a la pregunta de filtro
  if (contextoGlobal === "preguntando_idiomas") {
    if (verificar(["clc", "pdf", "documento", "guia", "guía", "acreditar"])) {
      responder("pdf_clc");
      return;
    }
    if (verificar(["contacto", "correo", "mail", "escribir", "general", "matricula", "informacion", "información", "centro", "idiomas", "atencion", "atención"])) {
      responder("idiomas");
      return;
    }
  }


  // 2. INTENCIONES GENERALES CRÍTICAS (EVALUACIÓN ESPECÍFICA DE RECHAZOS PRIMERO)

  // Filtro directo: Primer Reclamo Rechazado
  if (verificar(["primer", "1er"]) && verificar(["no pasa", "rechaza", "denega", "rebot", "no proced"]) && verificar(["reclamo"])) {
    bot("Existen varios motivos, pero el común es que no fundamentaste bien, lamentablemente no podrás presentar otro reclamo o un segundo reclamo ya que el primero no pasa.");
    contextoGlobal = "preguntando_reclamos";
    botonesContextuales([
      { texto: "📝 ¿Cómo hacer un segundo reclamo?", valor: "como hacer un segundo reclamo" },
      { texto: "📂 Ir al menú de Reclamos", valor: "reclamos" }
    ]);
  }
  // Filtro directo: Cómo/Presentar un Segundo Reclamo
  else if (verificar(["como", "cómo", "presentar", "hacer", "gestion", "gestión"]) && verificar(["segundo", "2do"]) && verificar(["reclamo"])) {
    bot("En ventanilla de secretaría académica hay una guía para hacer el segundo reclamo, pero te adelanto algo importante, los segundos reclamos se presentan únicamente en ventanilla, no en el buzón.");
    contextoGlobal = "preguntando_reclamos";
    botonesContextuales([
      { texto: "👁️ ¿Cómo ver mi 2do Reclamo?", valor: "como puedo ver mi segundo reclamo" },
      { texto: "❓ ¿Qué pasa si lo rechazan?", valor: "que pasa si me rechazan mi segundo reclamo" }
    ]);
  }
  // Filtro directo: Rechazo de Segundo Reclamo
  else if (verificar(["segundo", "2do"]) && verificar(["rechaza", "no pasa", "denega", "rebot", "no proced"]) && verificar(["reclamo"])) {
    bot("Debes fundamentarlo mejor ya que un segundo reclamo es más específico");
    contextoGlobal = "preguntando_reclamos";
    setTimeout(() => opciones(), 600);
  }
  // Filtro directo: Dónde ver la segunda instancia
  else if (verificar(["segundo", "2do"]) && verificar(["donde", "ver", "revisar", "solicitar", "visuali"]) && verificar(["reclamo"])) {
    bot("Únicamente lo puedes solicitar de manera presencial en la secretaría académica, algo importante es que no te lo puedes llevar ni tomar foto, solo mirarlo y revisarlo");
    contextoGlobal = "preguntando_reclamos";
    setTimeout(() => opciones(), 600);
  }

  // Bloque: Horario de atención de Secretaría Académica (Expandido)
  else if (verificar(["secretaria academica", "secretaría académica", "secretaria", "secretaría", "secre"]) && 
      verificar(["a que hora", "a qué hora", "abre", "abren", "horario", "atencion", "atención", "atienden", "atiende", "horas", "hasta que hora", "cierra", "cierran", "abierto"])) {
    bot("🕒 Horario de atención en secretaría: 10:00 am - 12:30 pm y 4:10 pm - 5:30 pm<br>📞 Anexo: 3113");
    contextoGlobal = "secretaria";
    botonesContextuales([
      { texto: "📧 Correo de Secretaría", valor: "correo de secretaria académica" },
      { texto: "📞 Llamar al anexo", valor: "anexo de secretaria" }
    ]);
  }

  // Bloque: Solicitudes fuera de hora o plazo
  else if(verificar(["fuera de la hora", "fuera de hora", "fuera de plazo", "plazo vencido", "vencio el plazo", "venció el plazo", "reclamar tarde", "reclamo tarde", "se me paso el plazo", "se me pasó el plazo", "tiempo vencido"])) {
    bot("No procederá ya que son plazos establecidos.");
    setTimeout(() => opciones(), 600);
  }

  // Banco de Empatía desglosado 1: Jarvis estoy triste
  else if(verificar(["jarvis estoy triste", "triste jarvis", "estoy triste", "me siento triste", "estoy deprimido", "me siento deprimido", "estoy deprimida", "me siento deprimida"])) {
    const rTriste = [
      "Lamento mucho que te sientas así... Sé que la presión en la UDEP puede llegar a ser abrumadora, pero por favor, no te rindas. Jalar un examen o incluso un curso no define tu inteligencia ni tu futuro. Estoy aquí contigo, respira hondo y vamos paso a paso. Todo va a estar bien.",
      "Es completamente válido sentirse triste o deprimido cuando las cosas se ponen cuesta arriba, la vida universitaria pesa un montón a veces. Pero una mala nota no borra todo tu esfuerzo. No cargues con todo esto a solas; enfócate en lo que puedes controlar hoy y avanza a tu propio ritmo. Confío en ti."
    ];
    bot(rTriste[Math.floor(Math.random() * rTriste.length)]);
    setTimeout(() => opciones(), 600);
  }

  // Banco de Empatía desglosado 2: Voy a jalar / miedo de jalar
  else if(verificar(["voy a jalar", "tengo miedo de jalar", "tengo miedo a jalar", "creo que me ira mal", "creo que me irá mal", "no se que hacer si jalo", "no sé qué hacer si jalo"])) {
    const rJalar = [
      "Sé que da muchísimo miedo ver un panorama difícil y sentir que las cosas van a salir mal, pero un tropiezo es solo parte del camino. No dejes que la frustración de hoy te haga dudar de tu talento. Date un respiro, lávate la cara y recuerda que eres más fuerte que cualquier nota baja.",
      "Lamento mucho que te sientas así... Sé que la presión en la UDEP puede llegar a ser abrumadora, pero por favor, no te rindas. Jalar un examen o incluso un curso no define tu inteligencia ni tu futuro. Estoy aquí contigo, respira hondo y vamos paso a paso. Todo va a estar bien."
    ];
    bot(rJalar[Math.floor(Math.random() * rJalar.length)]);
    setTimeout(() => opciones(), 600);
  }

  // Banco de Empatía desglosado 3: Siento presión o distre
  else if(verificar(["presionado", "presionada", "me siento presionado", "me siento presionada", "distre", "bajon", "bajón", "bajoneado", "bajoneada"])) {
    bot("Es completamente válido sentirse abrumado cuando las cosas se ponen cuesta arriba, la vida universitaria en CC.EE.EE. pesa un montón a veces. Pero una mala racha no borra todo tu esfuerzo. Date un pequeño descanso, despeja la mente 15 minutos y vuelve con fuerza. Confío en ti.");
    setTimeout(() => opciones(), 600);
  }

  // Pregunta sobre el creador / Lázaro
  else if(verificar(["creador", "creo", "creó", "dueño", "dueno", "inventor", "programo", "programó", "diseñó", "diseno", "hizo", "lazaro", "lázaro", "purizaca"])) {
    bot("Mi creador es Lázaro Purizaca, estudió en UDEP como tú");
    setTimeout(() => opciones(), 600);
  }
  
  // Objetos perdidos
  else if(verificar(["perdio", "perdió", "perdí", "perdi", "olvide", "olvidé", "busco", "encontre", "encontré", "perdidas", "perdidos", "mochila", "casaca", "objeto", "llaves", "celular", "cartuchera"])) {
    bot("Depende de la sinceridad de la persona, puede que tu objeto perdido se encuentre en la secretaría académica de la facultad, pero también de ingeniería o en la sala de control que es la puerta blanca.");
    setTimeout(() => opciones(), 600);
  }

  // Requisitos para recoger evaluaciones
  else if(verificar(["necesito para recoger", "necesito para recojer", "requisito para recoger", "requisitos para recoger", "llevar para recoger", "puedo recoger mi examen", "puedo recojer mi examen"])) {
    bot("Necesitas tu identificación en físico o puedes enseñar tu siga");
    contextoGlobal = "examen_recojo";
    setTimeout(() => opciones(), 600);
  }

  // Funcionamiento de impresoras
  else if(verificar(["usar las impresoras", "usar la impresora", "imprimir", "fotocopiadora", "fotocopias", "impresiones", "como imprimo", "cómo imprimo", "saca copia", "instrucciones"])) {
    bot("Hasta donde sé, existen un código QR y unas indicaciones pegadas en la pared, justo donde se encuentra la fotocopiadora");
    setTimeout(() => opciones(), 600);
  }

  // Tolerancia oficial de exámenes
  else if(verificar(["tiempo de tolerancia", "minutos de tolerancia", "tolerancia hay", "tolerancia examen", "cuanto de tolerancia", "cuánto de tolerancia", "minutos tarde puedo llegar"])) {
    bot("Según el RFAG, solo existen 15 minutos de tolerancia después de iniciar el examen, o sea que si empieza a las 2:00 p.m, entonces hay tolerancia de 2:15 p.m. (lo encuentras en el artículo 37 inciso 37.2)");
    contextoGlobal = "examen_tolerancia";
    setTimeout(() => opciones(), 600);
  }

  // Qué pasa si llego tarde
  else if(verificar(["llego tarde", "llegar tarde", "si llego tarde", "tarde al examen", "tarde a mi examen", "me pase de la tolerancia", "quede dormido", "quedé dormido"])) {
