<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis UDEP</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #F5F7FA;
  }

  #app {
    max-width: 420px;
    height: 100vh;
    margin: auto;
    display: flex;
    flex-direction: column;
    background: white;
  }

  #header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid #ddd;
  }

  .logo-left {
    width: 100px;
  }

  .header-text {
    color: #003A8F;
    font-weight: 500;
  }

  #chat {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
  }

  .msg {
    max-width: 75%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 12px;
  }

  .bot {
    background: #eee;
  }

  .user {
    background: #003A8F;
    color: white;
    margin-left: auto;
  }

  .time {
    font-size: 10px;
    opacity: 0.6;
    text-align: right;
  }

  .btn {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    margin: 6px 0;
    border-radius: 12px;
    background: #003A8F;
    color: white;
    border: none;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .num {
    width: 28px;
    height: 28px;
    background: white;
    color: #003A8F;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }

  .txt { flex: 1; text-align: left; }

  .icon { font-size: 16px; }

  /* Contenedor dinámico de botones contextuales inteligentes */
  .ctx-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 4px 0 10px 0;
    animation: aparecer 0.3s ease;
  }

  .ctx-btn {
    background: #F0F4FA;
    color: #003A8F;
    border: 1px solid #003A8F;
    padding: 10px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    font-weight: 500;
  }

  .ctx-btn:hover {
    background: #003A8F;
    color: white;
  }

  #inputArea {
    display: flex;
    padding: 10px;
    background: #eee;
  }

  #input {
    flex: 1;
    padding: 14px;
    font-size: 15px;
    border-radius: 10px;
    border: none;
  }

  button.send-btn {
    margin-left: 5px;
    padding: 14px;
    font-size: 16px;
    border-radius: 10px;
    background: #003A8F;
    color: white;
    border: none;
    cursor: pointer;
  }

  .despedida {
    text-align: center;
    animation: aparecer 0.5s ease;
  }

  .despedida img {
    width: 100px;
    border-radius: 12px;
    animation: bounce 1s ease;
  }

  .footer-creditos {
    text-align: center;
    font-size: 11px;
    color: #888;
    padding: 8px 0;
    background: #eee;
    border-top: 1px solid #ddd;
  }

  @keyframes aparecer {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes bounce {
    0% { transform: translateY(0); }
    30% { transform: translateY(-10px); }
    60% { transform: translateY(5px); }
    100% { transform: translateY(0); }
  }
</style>

<!-- CARGAMOS LA LIBRERÍA DE INYECCIÓN DE GOOGLE GEMINI DESDE NAVEGADOR -->
<script type="importmap">
  {
    "imports": {
      "@google/generative-ai": "https://esm.run/@google/generative-ai"
    }
  }
</script>
</head>

<body>

<div id="app">
  <div id="header">
    <img class="logo-left" src="https://www.udep.edu.pe/direccion-comunicacion/wp-content/uploads/sites/20/2020/11/LogoUDEPazul.png">
    <div class="header-text">CC.EE.EE</div>
  </div>

  <div id="chat"></div>

  <div id="inputArea">
    <input id="input" placeholder="Escribe &quot;Hola&quot; para empezar">
    <button class="send-btn" id="btnEnviar">➤</button>
  </div>

  <div class="footer-creditos">
    Una creación de: Lázaro Purizaca
  </div>
</div>

<script type="module">
import { GoogleGenerativeAI } from "@google/generative-ai";

// API KEY INYECTADA Y OPERATIVA
const API_KEY = "AQ.Ab8RN6JFhrUP44UvEo7ZfIe3cGJLIFDGTmr-iCCFLbvTXWoJcA"; 
const genAI = new GoogleGenerativeAI(API_KEY);

const chat = document.getElementById("chat");
let contextoGlobal = ""; 

// Instrucción del Sistema base para el razonamiento de la IA
const INSTRUCCIONES_JARVIS = `
Eres Jarvis, el asistente virtual inteligente de la Facultad de Ciencias Económicas y Empresariales (CC.EE.EE) de la Universidad de Piura (UDEP), campus Piura. Fuiste creado y programado por Lázaro Purizaca.

INSTRUCCIONES DE IDENTIDAD Y TONO:
- Tu tono debe ser extremadamente empático, comprensivo, humano y amigable, especialmente cuando los alumnos expresen tristeza, estrés, deprimido, bloqueo o miedo a jalar. Valida sus sentimientos y dales aliento antes de cualquier trámite.
- Puedes usar sutilmente expresiones universitarias peruanas o de Piura (como "bica", "trica", "yuca", "jalar", "secre") para sonar cercano, pero manteniendo el respeto institucional.
- Si no sabes la respuesta a algo o ocurre algún error de lógica externa, tu respuesta siempre debe ser exactamente: "Aún mi creador me está educando y trato de reconocer todo lo que me dicen".

REGLAS DE CONTEXTO FIJAS (PROHIBIDO INVENTAR DATOS):
1. CREADOR: Tu creador es Lázaro Purizaca, quien estudió en la UDEP como ellos.
2. SECRETARÍA: Horario: 10:00 am - 12:30 pm y 4:10 pm - 5:30 pm. Anexo: 3113. Correo: secretaria.academica.cceeee@udep.edu.pe
3. VENTANILLA: Horario: 9:00 am - 12:30 pm y 4:00 pm - 6:00 pm.
4. SALAS DE ESTUDIO: Solicitud con 2 días de anticipación por correo a: safcceeee-piura@udep.edu.pe. Mínimo 3 personas, máximo 6, por un tope de 4 horas.
5. EXÁMENES: Tolerancia de 15 minutos (Art. 37 inciso 37.2 del RFAG). Si llegan tarde por salud se justifica en SIGA; si es por descuido, se pierde y anula. Para recogerlos se necesita DNI físico o mostrar el SIGA.
6. PLAZOS DE RECLAMOS: Los reclamos fuera de hora o fuera de plazo NO proceden por políticas establecidas.
7. RECHAZO DE 1ER RECLAMO: Si un alumno dice que le rechazaron o no pasó su 1er reclamo, explícale de forma directa que el motivo común es que no se fundamentó bien, por lo que el primero no pasa. Luego, ofrécele los pasos para el segundo reclamo.
8. SEGUNDO RECLAMO: Se presenta ÚNICAMENTE en la ventanilla física de secretaría académica (nunca en el buzón). En ventanilla hay una guía física publicada con el procedimiento exacto. Si el segundo reclamo es rechazado, es porque debe fundamentarse mejor ya que es más específico.
9. VER SEGUNDO RECLAMO: Solo se puede solicitar y revisar de manera presencial en secretaría académica. Está estrictamente prohibido tomarle foto o llevárselo; solo se puede mirar y revisar ahí mismo.

REGLA DE SALIDA (FORMATO JSON OBLIGATORIO):
Debes responder SIEMPRE en formato JSON estricto para que la interfaz web pueda leerte. No agregues texto explicativo ni marcas de código markdown antes o después del JSON. Usa exactamente esta estructura:
{
  "respuesta": "Texto de tu respuesta empática aquí (puedes usar etiquetas HTML como <b>, 📧 o <br> para estructurar)",
  "contexto": "nombre_del_contexto_actual",
  "botones": [
    {"texto": "Texto Botón Contextual 1", "valor": "entrada de texto asociada al boton 1"},
    {"texto": "Texto Botón Contextual 2", "valor": "entrada de texto asociada al boton 2"}
  ]
}
Si la conversación no requiere botones o llega a su fin, deja el arreglo vacío: "botones": [].
`;

window.hora = function() {
  const d=new Date();
  return d.getHours()+":"+d.getMinutes().toString().padStart(2,'0');
}

window.bot = function(msg) {
  const div=document.createElement("div");
  div.className="msg bot";
  div.innerHTML=msg + `<div class="time">${window.hora()}</div>`;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

window.user = function(msg) {
  const div=document.createElement("div");
  div.className="msg user";
  div.innerHTML=msg + `<div class="time">${window.hora()}</div>`;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

window.botonesContextuales = function(lista) {
  window.limpiarContextuales();
  const contenedor = document.createElement("div");
  contenedor.className = "ctx-container";
  lista.forEach(item => {
    const b = document.createElement("button");
    b.className = "ctx-btn";
    b.innerHTML = item.texto;
    b.onclick = () => {
      document.getElementById("input").value = item.valor;
      window.enviar();
    };
    contenedor.appendChild(b);
  });
  chat.appendChild(contenedor);
  chat.scrollTop = chat.scrollHeight;
}

window.limpiarContextuales = function() {
  document.querySelectorAll(".ctx-container").forEach(c => c.remove());
}

window.btn = function(text,val){
  const b=document.createElement("button");
  b.className="btn";
  const partes = text.split(" ");
  const numero = partes[0];
  const texto = partes.slice(1).join(" ");

  let icono="📌";
  if(val==="1") icono="🕒";
  if(val==="2") icono="🏢";
  if(val==="3") icono="📚";
  if(val==="4") icono="📅";

  b.innerHTML = `
    <span class="num">${numero}</span>
    <span class="txt">${texto}</span>
    <span class="icon">${icono}</span>
  `;
  b.onclick=()=>window.responderMenuRigido(val);
  chat.appendChild(b);
}

window.limpiarMenuRigido = function() {
  document.querySelectorAll(".btn").forEach(b=>b.remove());
  window.limpiarContextuales();
}

window.menu = function() {
  window.limpiarMenuRigido();
  contextoGlobal = ""; 
  window.bot("Selecciona una opción o escríbeme libremente lo que necesitas saber:");
  window.btn("1 Horario de atención en ventanilla","1");
  window.btn("2 Horario de atención en secretaría","2");
  window.btn("3 Cómo reservar sala de estudio","3");
  window.btn("4 Publicación de exámenes / Calendario","4");
}

window.responderMenuRigido = function(val) {
  window.limpiarMenuRigido();
  if(val==="1") {
    document.getElementById("input").value = "Horario de ventanilla";
    window.enviar();
  } else if(val==="2") {
    document.getElementById("input").value = "Horario de secretaria academica";
    window.enviar();
  } else if(val==="3") {
    document.getElementById("input").value = "Como reservar una sala de estudio";
    window.enviar();
  } else if(val==="4") {
    document.getElementById("input").value = "Ver publicacion de examenes y calendario";
    window.enviar();
  }
}

// --- CONEXIÓN DIRECTA AL MOTOR CONTEXTUAL DE GEMINI ---
window.enviar = async function() {
  const input = document.getElementById("input");
  const texto = input.value.trim();
  if(texto === "") return;
  
  input.value = "";
  window.user(texto);
  window.limpiarContextuales();
  window.limpiarMenuRigido();

  try {
    const model = genAI.getGenerativeModel({ 
      model: "gemini-1.5-flash",
      systemInstruction: INSTRUCCIONES_JARVIS,
      generationConfig: { responseMimeType: "application/json" }
    });

    const prompt = `Contexto acumulado: ${contextoGlobal}. Entrada del estudiante de CC.EE.EE: "${texto}".`;
    const result = await model.generateContent(prompt);
    
    // Parseo seguro del JSON generado en tiempo real por el modelo
    const dataIA = JSON.parse(result.response.text());

    window.bot(dataIA.respuesta);
    contextoGlobal = dataIA.contexto;

    if(dataIA.botones && dataIA.botones.length > 0) {
      window.botonesContextuales(dataIA.botones);
    }

  } catch (error) {
    console.error("Error de API:", error);
    window.bot("Aún mi creador me está educando y trato de reconocer todo lo que me dicen");
    setTimeout(() => window.menu(), 1000);
  }
}

document.getElementById("btnEnviar").onclick = window.enviar;
document.getElementById("input").addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    window.enviar();
  }
});

window.onload = () => {
  const div=document.createElement("div");
  div.className="msg bot";
  div.innerHTML = `
    <div style="text-align:center">
      <img src="mascota.png.jfif" style="width:120px; border-radius:12px; margin-bottom:10px;">
      <br>
      <b>Hola, soy Jarvis 👋</b><br>
      ¿En qué puedo ayudarte?
    </div>
  `;
  chat.appendChild(div);
  window.menu();
};
</script>

</body>
</html>
