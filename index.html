<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis UDEP</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #F5F7FA;
  }

  #app {
    max-width: 420px;
    height: 100vh;
    margin: auto;
    display: flex;
    flex-direction: column;
    background: white;
  }

  #header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid #ddd;
  }

  .logo-left {
    width: 100px;
  }

  .header-text {
    color: #003A8F;
    font-weight: 500;
  }

  #chat {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
  }

  .msg {
    max-width: 75%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 12px;
  }

  .bot {
    background: #eee;
  }

  .user {
    background: #003A8F;
    color: white;
    margin-left: auto;
  }

  .time {
    font-size: 10px;
    opacity: 0.6;
    text-align: right;
  }

  .btn {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    margin: 6px 0;
    border-radius: 12px;
    background: #003A8F;
    color: white;
    border: none;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .num {
    width: 28px;
    height: 28px;
    background: white;
    color: #003A8F;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }

  .txt { flex: 1; text-align: left; }

  .icon { font-size: 16px; }

  #inputArea {
    display: flex;
    padding: 10px;
    background: #eee;
  }

  #input {
    flex: 1;
    padding: 14px;
    font-size: 15px;
    border-radius: 10px;
    border: none;
  }

  button.send-btn {
    margin-left: 5px;
    padding: 14px;
    font-size: 16px;
    border-radius: 10px;
    background: #003A8F;
    color: white;
    border: none;
    cursor: pointer;
  }

  .despedida {
    text-align: center;
    animation: aparecer 0.5s ease;
  }

  .despedida img {
    width: 100px;
    border-radius: 12px;
    animation: bounce 1s ease;
  }

  .footer-creditos {
    text-align: center;
    font-size: 11px;
    color: #888;
    padding: 8px 0;
    background: #eee;
    border-top: 1px solid #ddd;
  }

  @keyframes aparecer {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes bounce {
    0% { transform: translateY(0); }
    30% { transform: translateY(-10px); }
    60% { transform: translateY(5px); }
    100% { transform: translateY(0); }
  }
</style>
</head>

<body>

<div id="app">
  <div id="header">
    <img class="logo-left" src="https://www.udep.edu.pe/direccion-comunicacion/wp-content/uploads/sites/20/2020/11/LogoUDEPazul.png">
    <div class="header-text">CC.EE.EE</div>
  </div>

  <div id="chat"></div>

  <div id="inputArea">
    <input id="input" placeholder="Escribe &quot;Hola&quot; para empezar">
    <button class="send-btn" onclick="enviar()">➤</button>
  </div>

  <div class="footer-creditos">
    Una creación de: Lázaro Purizaca
  </div>
</div>

<script>
const chat = document.getElementById("chat");

function hora(){
  const d=new Date();
  return d.getHours()+":"+d.getMinutes().toString().padStart(2,'0');
}

function bot(msg){
  const div=document.createElement("div");
  div.className="msg bot";
  div.innerHTML=msg + `<div class="time">${hora()}</div>`;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function user(msg){
  const div=document.createElement("div");
  div.className="msg user";
  div.innerHTML=msg + `<div class="time">${hora()}</div>`;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function bienvenida(){
  const div=document.createElement("div");
  div.className="msg bot";
  div.innerHTML = `
    <div style="text-align:center">
      <img src="mascota.png.jfif" style="width:120px; border-radius:12px; margin-bottom:10px;">
      <br>
      <b>Hola, soy Jarvis 👋</b><br>
      ¿En qué puedo ayudarte?
    </div>
  `;
  chat.appendChild(div);
  menu();
}

function btn(text,val){
  const b=document.createElement("button");
  b.className="btn";
  const partes = text.split(" ");
  const numero = partes[0];
  const texto = partes.slice(1).join(" ");

  let icono="📌";
  if(val==="1") icono="🕒";
  if(val==="2") icono="🏢";
  if(val==="3") icono="📚";
  if(val==="4") icono="📅";
  if(val==="tramites") icono="🧭";
  if(val==="guias") icono="📂";

  b.innerHTML = `
    <span class="num">${numero}</span>
    <span class="txt">${texto}</span>
    <span class="icon">${icono}</span>
  `;
  b.onclick=()=>responder(val);
  chat.appendChild(b);
}

function limpiar(){
  document.querySelectorAll(".btn").forEach(b=>b.remove());
}

function menu(){
  limpiar();
  bot("Selecciona una opción:");
  btn("1 Horario de atención en ventanilla","1");
  btn("2 Horario de atención en secretaría","2");
  btn("3 Cómo reservar sala de estudio","3");
  btn("4 Publicación de exámenes / Calendario","4");
  btn("5 Información sobre trámites","tramites");
  btn("6 Guías y Documentos PDF","guias");
}

function menuTramites(){
  limpiar();
  bot("¿Sobre qué necesitas ayuda?");
  btn("1 Bachiller / Egresado","egresado");
  btn("2 Certificados / Documentos","docs");
  btn("3 Idiomas","idiomas");
  btn("4 Mesa de ayuda","mesa");
  btn("5 Volver al inicio","si");
}

function menuGuias(){
  limpiar();
  bot("📂 <b>Documentos y Guías PDF:</b><br>Selecciona para abrir el archivo.");
  btn("1 Prácticas Pre Profesionales", "pdf_practicas");
  btn("2 Presentación de CLC", "pdf_clc");
  btn("3 Justificación de Inasistencias", "pdf_inasistencias");
  btn("4 Reprogramación de Exámenes", "pdf_repro");
  btn("5 Hoja de Reclamos", "pdf_reclamos");
  btn("6 Volver al inicio", "si");
}

function opciones(){
  bot("¿Necesitas otra opción?");
  btn("1 Sí","si");
  btn("2 No","no");
}

function enviar(){
  const input=document.getElementById("input");
  const texto=input.value.trim().toLowerCase();
  if(texto==="") return;
  input.value="";
  user(texto);

  // --- MOTOR COGNITIVO DE CONVERSACIÓN (SIMULACIÓN IA) ---

  // Helper para evaluar múltiples palabras clave de nuestro diccionario expandido
  const verificar = (lista) => lista.some(palabra => texto.includes(palabra));

  // Pregunta sobre el creador / Diseñador / Programador
  if(verificar(["creador", "creo", "creó", "dueño", "dueno", "inventor", "programo", "programó", "diseñó", "diseno", "hizo", "lazaro", "purizaca"])) {
    bot("Mi creador es Lázaro Purizaca, estudió en UDEP como tú");
    setTimeout(() => opciones(), 600);
  }
  
  // Flujo: Objetos perdidos / Cosas perdidas en campus
  else if(verificar(["perdio", "perdió", "perdí", "perdi", "olvide", "olvidé", "busco", "encontre", "encontré", "perdidas", "perdidos", "mochila", "casaca", "objeto", "llaves", "celular", "cartuchera"])) {
    bot("Depende de la sinceridad de la persona, puede que tu objeto perdido se encuentre en la secretaría académica de la facultad, pero también de ingeniería o en la sala de control que es la puerta blanca.");
    setTimeout(() => opciones(), 600);
  }

  // Flujo Expandido: Qué necesito para recoger mi examen
  else if(verificar(["necesito para recoger", "necesito para recojer", "requisito para recoger", "requisitos para recoger", "llevar para recoger", "puedo recoger mi examen", "puedo recojer mi examen", "piden para recoger", "retirar mi examen", "entregar mi examen", "enseñar mi siga", "identificacion en fisico"])) {
    bot("Necesitas tu identificación en físico o puedes enseñar tu siga");
    setTimeout(() => opciones(), 600);
  }

  // Flujo Expandido: Cómo puedo usar las impresoras
  else if(verificar(["usar las impresoras", "usar la impresora", "imprimir", "fotocopiadora", "fotocopias", "impresiones", "como imprimo", "cómo imprimo", "saca copia", "instrucciones para imprimir", "codigo qr", "código qr", "esta pegada en la pared"])) {
    bot("Hasta donde sé, existen un código QR y unas indicaciones pegadas en la pared, justo donde se encuentra la fotocopiadora");
    setTimeout(() => opciones(), 600);
  }

  // Flujo Expandido: Cuánto tiempo de tolerancia hay
  else if(verificar(["tiempo de tolerancia", "minutos de tolerancia", "tolerancia hay", "tolerancia examen", "tolerancia para entrar", "cuanto de tolerancia", "cuánto de tolerancia", "minutos tarde puedo llegar", "tiempo limite", "tiempo límite", "dejan entrar al examen", "rfag", "articulo 37", "artículo 37"])) {
    bot("Según el RFAG, solo existen 15 minutos de tolerancia después de iniciar el examen, o sea que si empieza a las 2:00 p.m, entonces hay tolerancia de 2:15 p.m. (lo encuentras en el artículo 37 inciso 37.2)");
    setTimeout(() => opciones(), 600);
  }

  // Flujo Expandido: Qué pasa si llego tarde a mi examen
  else if(verificar(["llego tarde", "llegar tarde", "si llego tarde", "tarde al examen", "tarde a mi examen", "me pase de la tolerancia", "no llegue a tiempo", "quede dormido", "quedé dormido", "no llegue al examen", "falto por enfermedad", "perdi mi examen", "perdí mi examen"])) {
    bot("Depende, si es por salud puedes justificarlo a través de SIGA en la parte de “trámites” y si fue por un descuido, simplemente lo pierdes y lo anulas, debes de tener cuidado y estudiar mucho.");
    setTimeout(() => opciones(), 600);
  }

  // Flujo Exhaustivo: Solicitud de Correos Electrónicos Directos
  else if(verificar(["correo", "mail", "email", "escribir a", "escribirle", "contacto de", "direccion de"])) {
    if(verificar(["secretaria", "secretaría", "academica", "académica", "secre"])) {
      bot("El correo institucional de <b>Secretaría Académica</b> es:<br>📧 <b style='color:#003A8F;'>secretaria.academica.cceeee@udep.edu.pe</b>");
    }
    else if(verificar(["sala", "salas", "cubiculo", "cubículo", "cubis", "safcceeee", "separar", "reserva"])) {
      bot("El correo para solicitar la <b>Reserva de Salas de Estudio</b> es:<br>📧 <b style='color:#003A8F;'>safcceeee-piura@udep.edu.pe</b>");
    }
    else if(verificar(["egresado", "bachiller", "titulo", "título", "grado", "melissa", "coello"])) {
      bot("El correo de la <b>Oficina de Atención al Egresado</b> es:<br>📧 <b style='color:#003A8F;'>melissa.coello@udep.edu.pe</b>");
    }
    else if(verificar(["certificado", "constancia", "historial", "documento", "oficiales", "record", "récord"])) {
      bot("El correo para solicitar <b>Documentos Oficiales</b> es:<br>📧 <b style='color:#003A8F;'>documentos.oficiales@udep.edu.pe</b>");
    }
    else if(verificar(["idioma", "idiomas", "ingles", "inglés", "centro de idiomas"])) {
      bot("El correo del <b>Centro de Idiomas</b> es:<br>📧 <b style='color:#003A8F;'>idiomas@udep.edu.pe</b>");
    }
    else if(verificar(["ayuda", "mesa", "siga", "contraseña", "sistemas", "it", "soporte"])) {
      bot("El correo de la <b>Mesa de Ayuda</b> de Sistemas es:<br>📧 <b style='color:#003A8F;'>mesadeayuda@udep.edu.pe</b>");
    }
    else {
      bot("¿De qué área específica necesitas el correo? Puedes seleccionar una opción de trámites o guías para visualizar los datos de contacto directos.");
      setTimeout(() => menu(), 600);
      return;
    }
    setTimeout(() => opciones(), 600);
  }

  // NUEVO FLUJO: Solo Calendario y Feriados (Evitando cruces con exámenes)
  else if(verificar(["calendario", "feriado", "feriados", "vacaciones", "descanso", "no hay clase", "lectiva", "lectivas", "suspension", "suspensión", "cronograma"]) && !verificar(["examen", "examenes", "exámenes", "parcial", "final", "rol"])) {
    bot("Perfecto. Si deseas revisar el Calendario Académico oficial para verificar las semanas lectivas, suspensiones de clases o días feriados del ciclo, aquí tienes el enlace:");
    setTimeout(() => {
      limpiar();
      bot("📅 <b>Calendario Académico:</b>");
      const b2=document.createElement("button");
      b2.className="btn";
      b2.innerHTML="📅 Calendario Académico PDF";
      b2.onclick=()=>window.open("https://udepoffice365ms-my.sharepoint.com/:b:/g/personal/lazaro_purizaca_g_udep_edu_pe/IQAdJf7wjXsIRIHlr_2phXDQAW8NxF2VNk6DrKX2avNOo-8?e=RW95nO","_blank");
      chat.appendChild(b2);
      opciones();
    }, 600);
  }
  // Bachiller / Egresado
  else if(verificar(["bachiller", "egresado", "egresada", "egrese", "egresé", "egresar", "titulo", "título", "titulacion", "titulación", "diploma", "grado", "graduarme", "graduacion", "graduación", "melissa", "coello"])) {
    bot("Claro, si deseas tramitar tu bachiller o consultar sobre tu condición de egresado, debes comunicarte con la Oficina de Atención al Egresado:");
    setTimeout(() => responder("egresado"), 600);
  } 
  // Certificados y Documentos
  else if(verificar(["certificado", "certificados", "constancia", "constancias", "historial", "historiales", "carta", "documento", "documentos", "notas", "record", "récord", "oficiales"])) {
    bot("Entendido. Para solicitar certificados, constancias oficiales o historiales académicos, debes escribir al área de Documentos Oficiales:");
    setTimeout(() => responder("docs"), 600);
  }
  // Reserva de Sala / Cubículos
  else if(verificar(["reserva", "reservar", "sala", "salas", "cubiculo", "cubículo", "cubiculos", "cubículos", "cubi", "cubis", "estudiar", "separar", "safcceeee", "ambiente"])) {
    bot("Por supuesto. Si quieres reservar un cubículo o sala de estudio para trabajar con tu grupo, aquí tienes el procedimiento y los requisitos indispensables:");
    setTimeout(() => responder("3"), 600);
  }
  // Exámenes, Evaluaciones y Roles
  else if(verificar(["examen", "examenes", "exámenes", "parcial", "parciales", "final", "finales", "recojer", "recoger", "rol", "roles", "fecha de examen", "recojo", "calificada"])) {
    bot("Por supuesto. Aquí tienes el acceso directo al rol oficial para ver los exámenes que ya están publicados y listos para recoger en la facultad:");
    setTimeout(() => responder("4"), 600);
  }
  // Justificación de inasistencias
  else if(verificar(["falta", "faltas", "falté", "falte", "inasistencia", "inasistencias", "justificar", "justificacion", "justificación", "enfermo", "enferma", "médico", "medico", "permiso", "descanso", "no asisti", "no asistí"])) {
    bot("Comprendo. Si has faltado a clases y necesitas presentar un justificante, aquí tienes el procedimiento oficial:");
    setTimeout(() => responder("pdf_inasistencias"), 600);
  }
  // Prácticas Pre Profesionales (PPP)
  else if(verificar(["practica", "práctica", "practicas", "prácticas", "convenio", "convenios", "ppp", "pre profesional", "preprofesionales", "pasantia", "pasantía", "empresa"])) {
    bot("Perfecto. Te abro el documento informativo sobre los convenios y el trámite de Prácticas Pre Profesionales (PPP):");
    setTimeout(() => responder("pdf_practicas"), 600);
  }
  // Reclamos / Quejas
  else if(verificar(["reclamo", "reclamos", "queja", "quejas", "reclamar", "sugerencia", "sugerencias", "libro", "reclamaciones"])) {
    bot("Entendido. Te comparto el enlace directo para que puedas revisar o descargar el formato de la Hoja de Reclamos institucional:");
    setTimeout(() => responder("pdf_reclamos"), 600);
  }
  // Reprogramación de Exámenes
  else if(verificar(["reprogramacion", "reprogramación", "reprogramar", "extemporaneo", "extemporáneo", "rezagado", "perdi mi examen", "perdí mi examen"])) {
    bot("Comprendo. Si no pudiste rendir un examen y requieres gestionar una reprogramación oficial, aquí tienes el enlace directo:");
    setTimeout(() => responder("pdf_repro"), 600);
  }
  // Idiomas / CLC
  else if(verificar(["idioma", "idiomas", "ingles", "inglés", "convalidar", "convalidación", "convalidacion", "centro de idiomas", "clc", "exoneracion"])) {
    bot("Con gusto. Para todo lo relacionado con convalidaciones de inglés, exámenes y matrículas, debes contactar al Centro de Idiomas:");
    setTimeout(() => {
      if (texto.includes("clc") || texto.includes("pdf")) {
        responder("pdf_clc");
      } else {
        responder("idiomas");
      }
    }, 600);
  }
  // Mesa de Ayuda / Accesos SIGA
  else if(verificar(["ayuda", "mesa", "siga", "contraseña", "contrasena", "correo", "usuario", "bloqueo", "acceso", "clave", "no puedo entrar", "sistemas", "it", "plataforma"])) {
    bot("Entiendo el inconveniente. Si tienes problemas de acceso con tu cuenta, correo institucional o la plataforma SIGA, comunícate con la Mesa de Ayuda:");
    setTimeout(() => responder("mesa"), 600);
  }
  // Horarios generales de atención
  else if(verificar(["horario", "horarios", "atencion", "atención", "ventanilla", "ventanillas", "secretaria", "secretaría", "secre", "abren", "atienden", "abierto"])) {
    bot("Te muestro los horarios de atención presencial de la facultad:");
    setTimeout(() => {
      if (texto.includes("secretaria") || texto.includes("secretaría") || texto.includes("secre")) {
        responder("2");
      } else {
        responder("1");
      }
    }, 600); 
  }
  // Trámites en general
  else if(verificar(["tramite", "tramites", "trámite", "trámites", "requisitos de", "como hago", "cómo hago", "gestion", "gestión"])) {
    bot("Te redirijo a la sección de trámites de la facultad:");
    setTimeout(() => responder("tramites"), 600);
  }
  // Guías y PDFs en general
  else if(verificar(["guia", "guias", "guía", "guías", "documento", "documentos", "pdf", "descargar", "link", "enlace", "formatos"])) {
    bot("Te muestro el listado de documentos y guías PDF disponibles:");
    setTimeout(() => responder("guias"), 600);
  }
  // Saludos
  else if(verificar(["hola", "buenos dias", "buenos días", "buenas tardes", "buenas noches", "que tal", "qué tal", "saludos", "jarvis", "oe", "holaa", "aló", "alo"])) {
    bot("¡Hola de nuevo! 😊 Cuéntame, ¿en qué te puedo asesorar hoy?");
    setTimeout(() => menu(), 600);
  }
  // Respuestas Directas de Confirmación Sí / No
  else if(texto === "si" || texto === "sí" || texto === "claro" || texto === "por favor" || texto === "porfa") {
    responder("si");
  }
  else if(texto === "no" || texto === "gracias" || texto === "ya no" || texto === "nada mas" || texto === "nada más" || texto === "chau" || texto === "adios" || texto === "adiós") {
    responder("no");
  }
  // Otros casos (No entiende)
  else {
    bot("Disculpa, mi creador aún me está educando para poder comprender todo");
    setTimeout(() => menu(), 600);
  }
}

document.getElementById("input").addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    enviar();
  }
});

window.onload=bienvenida;

function responder(t){
  limpiar();

  if(t.includes("hola") || t === "si"){
    menu();
  }

  else if(t==="1"){
    bot("🕒 Horario de atención en ventanilla: 9:00 am - 12:30 pm y 4:00 pm - 6:00 pm");
    opciones();
  }

  else if(t==="2"){
    bot("🕒 Horario de atención en secretaría: 10:00 am - 12:30 pm y 4:10 pm - 5:30 pm<br>📞 Anexo: 3113");
    opciones();
  }

  else if(t==="3"){
    bot(`📚 <b>Reserva de sala:</b><br><br>
Las reservas deben ser solicitadas a través del correo Udep del alumno:<br>
📧 <b style="color:#003A8F;">safcceeee-piura@udep.edu.pe</b><br><br>
<b>Datos requeridos:</b><br>
✓ Asunto: Reserva de Sala de Estudio<br>
✓ Nombre del responsable y P.A. al que pertenece<br>
✓ Integrantes (mínimo 3 personas y máximo 6)<br>
✓ Día - Hora de inicio y culminación<br><br>
<b>Recomendaciones:</b><br>
✓ Mínimo 2 días hábiles de anticipación<br>
✓ Respuesta en 1 día<br>
✓ Lunes a viernes: 7:00 a.m. - 9:00 p.m.<br>
✓ Sábados: 7:00 a.m. - 1:00 p.m.<br>
✓ Máximo 4 horas por grupo`);
    opciones();
  }

  else if(t==="4"){
    bot("📄 <b>Calendario y Exámenes:</b>");
    const b1=document.createElement("button");
    b1.className="btn";
    b1.innerHTML="🔗 Exámenes disponibles para recoger";
    b1.onclick=()=>window.open("https://udepoffice365ms-my.sharepoint.com/:x:/g/personal/rosamaria_masias_udep_edu_pe/EWihxMsRb25Iuvkhp9RDLj0Bo7taaxBWoC3Zp5dMNehltQ?rtime=SpHsHsNV3Ug","_blank");
    chat.appendChild(b1);

    const b2=document.createElement("button");
